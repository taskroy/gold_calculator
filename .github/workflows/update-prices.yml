name: Update gold prices

on:
  schedule:
    # 8:45, 12:45 and 17:45 Dubai time (UTC+4)
    - cron: "45 4,8,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get today's prices
        run: python scripts/update_prices.py
      - name: Save if changed
        run: |
          git config user.name "gold-price-bot"
          git config user.email "gold-price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update gold prices"
          git push
